[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recap_smolvla"
version = "0.1.0"
description = "RECAP advantage-conditioned offline RL ported to SmolVLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "gymnasium>=0.29.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
pusht = ["gym_pusht>=0.1.1"]
lerobot = ["lerobot>=0.3.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "slow: requires GPU or real model weights (deselect with '-m not slow')",
    "integration: requires gym_pusht or lerobot installed",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["recap_smolvla"]
omit = ["tests/*"]
