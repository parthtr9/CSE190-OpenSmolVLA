[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolvla-recap"
version = "0.1.0"
description = "SmolVLA + RECAP: Reinforcement Learning with Advantage Conditioning for VLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers",
    "accelerate",
    "datasets",
    "wandb",
    "safetensors",
    "pillow",
    "numpy>=1.26.0",
    "mujoco>=3.0",
    "gymnasium>=0.29.0",
    "opencv-python",
    "lerobot>=0.5.1",
    "num2words>=0.5.14",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
pusht = ["gym_pusht>=0.1.1"]
dev = [
    "ruff",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smolvla_recap", "src/recap_smolvla"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "slow: requires GPU or real model weights (deselect with '-m not slow')",
    "integration: requires gym_pusht or lerobot installed",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["recap_smolvla"]
omit = ["tests/*"]
